appId: works.pi.desktop
productName: Pi Desktop
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  # Engine CLIs are downloaded on first use (see src/main/engine-binaries.ts).
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  # Documentation and examples that ship inside npm packages.
  - '!node_modules/@earendil-works/pi-coding-agent/{docs,examples}/**'
  - '!node_modules/**/{CHANGELOG,HISTORY}.md'
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - resources/plugins/**
win:
  executableName: pi-desktop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
mac:
  identity: "-"
  extraFiles:
    - from: resources/native/pi-computer-use-helper
      to: Helpers/pi-computer-use-helper
  binaries:
    - Contents/Helpers/pi-computer-use-helper
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSScreenCaptureUsageDescription: Pi Desktop 需要屏幕录制权限，用于截取屏幕与窗口（Computer Use）。Screen Recording is required to capture displays and windows.
  notarize: false
linux:
  target:
    - AppImage
    - deb
  maintainer: pi-desktop
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
