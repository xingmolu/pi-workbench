appId: works.pi.desktop
productName: Pi Desktop
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: pi-desktop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
mac:
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSScreenCaptureUsageDescription: Pi Desktop 需要屏幕录制权限，用于截取屏幕与窗口（Computer Use）。Screen Recording is required to capture displays and windows.
    - NSAppleEventsUsageDescription: Pi Desktop 需要通过系统事件读取窗口结构并发送确认后的键盘输入（Computer Use）。Apple Events are used to inspect UI structure and type after approval.
  notarize: false
linux:
  target:
    - AppImage
    - deb
  maintainer: pi-desktop
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
