name: Windows

# Runs the app on Windows: the Codex host against the real CLI and the core end-to-end specs.
# Manual while it is being brought up; it joins the main CI once green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch the pinned Codex CLI
        run: echo "PI_DESKTOP_CODEX_EXECUTABLE=$(node scripts/fetch-engine.mjs codex .engines)" >> "$GITHUB_ENV"

      - name: Codex host against the real CLI
        run: npx vitest run src/codex-host

      - name: Build
        run: npm run build

      - name: Electron on Windows
        run: >-
          npx playwright test
          tests/e2e/engine-download.spec.ts
          tests/e2e/engine-accounts.spec.ts
          tests/e2e/codex-runtime.spec.ts
          tests/e2e/claude-runtime.spec.ts
          tests/e2e/multi-session.spec.ts
          tests/e2e/coding-flow.spec.ts
          tests/e2e/desktop-settings.spec.ts
          tests/e2e/git-plugin.spec.ts
          tests/e2e/session-history.spec.ts
          tests/e2e/ui-experience.spec.ts
          --reporter=line
