name: Windows

# Runs the app on Windows: the Codex host against the real CLI and the core end-to-end specs.
# Manual while it is being brought up; it joins the main CI once green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch the pinned Codex CLI
        run: |
          executable=$(node scripts/fetch-engine.mjs codex .engines)
          echo "PI_DESKTOP_CODEX_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Codex host against the real CLI
        run: npx vitest run src/codex-host

      - name: Build
        run: npm run build

      - name: Electron on Windows
        run: >-
          npx playwright test
          tests/e2e/engine-download.spec.ts
          tests/e2e/engine-accounts.spec.ts
          tests/e2e/codex-runtime.spec.ts
          tests/e2e/claude-runtime.spec.ts
          tests/e2e/multi-session.spec.ts
          tests/e2e/coding-flow.spec.ts
          tests/e2e/desktop-settings.spec.ts
          tests/e2e/git-plugin.spec.ts
          tests/e2e/session-history.spec.ts
          tests/e2e/ui-experience.spec.ts
          tests/e2e/terminal-windows.spec.ts
          --reporter=line

      # The page snapshot Playwright saved for each failed spec, since artifacts are awkward to read.
      - name: Page state of failed specs
        if: failure()
        run: |
          for file in test-results/*/error-context.md; do
            [ -f "$file" ] || continue
            echo "=== $file"
            # The error and the page snapshot, without the spec's own source.
            awk '/^# Test source/ { skip = 1; next } /^# / { skip = 0 } !skip' "$file" | head -c 8000
            echo
          done

      # Why a terminal could not start: node-pty spawning PowerShell as the terminal host does.
      - name: Terminal spawn check
        if: failure()
        run: |
          cat > pty-check.cjs <<'JS'
          const { spawn } = require('node-pty')
          const shell = 'C:\\Program Files\\PowerShell\\7\\pwsh.exe'
          try {
            const pty = spawn(shell, ['-NoLogo', '-NoProfile'], {
              name: 'xterm-256color', cols: 80, rows: 24, cwd: process.cwd(),
              env: { SystemRoot: process.env.SystemRoot, Path: process.env.Path ?? process.env.PATH },
              encoding: 'utf8', handleFlowControl: false
            })
            let out = ''
            pty.onData((data) => { out += data })
            pty.write('Write-Output "PI_$(20+22)"\r')
            setTimeout(() => { console.log('spawned; output has PI_42:', out.includes('PI_42')); pty.kill(); process.exit(0) }, 8000)
          } catch (error) {
            console.log('spawn failed:', error && error.stack)
            process.exit(1)
          }
          JS
          echo "--- node"; node pty-check.cjs || true
          echo "--- electron as node"; ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe pty-check.cjs || true
