name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fonts for Chinese UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'

      - name: Build
        run: npm run build

      - name: Install Electron test runtime
        run: node node_modules/electron/install.js

      - name: Electron architecture and UI smoke
        run: >-
          xvfb-run -a npx playwright test
          tests/e2e/multi-session.spec.ts
          tests/e2e/session-task.spec.ts
          tests/e2e/desktop-settings.spec.ts
          tests/e2e/ui-experience.spec.ts
          tests/e2e/session-history.spec.ts
          tests/e2e/work-summary.spec.ts
          --reporter=line

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            artifacts/e2e/

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-experience-previews-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/e2e/ui-experience/

  package-pr:
    needs: e2e-smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package macOS ARM64 preview
        run: npx electron-builder --mac dmg zip --publish never

      - name: Upload PR installer
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-macos-arm64-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  package:
    needs: e2e-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            command: npx electron-builder --mac dmg zip --publish never
          - name: macos-x64
            os: macos-15-intel
            command: npx electron-builder --mac dmg zip --publish never
          - name: windows-x64
            os: windows-2025
            command: npx electron-builder --win nsis --publish never
          - name: linux-x64
            os: ubuntu-24.04
            command: npx electron-builder --linux AppImage deb --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*
