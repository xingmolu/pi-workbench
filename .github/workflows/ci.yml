name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture boundaries
        run: npm run check:architecture

      - name: Unit tests
        run: npm test

      - name: Codex host against the real CLI
        run: |
          export PI_DESKTOP_CODEX_EXECUTABLE="$(node scripts/fetch-engine.mjs codex .engines)"
          npx vitest run src/codex-host

      - name: Build
        run: npm run build

  macos-native-helper:
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile native Computer Use helper
        run: npm run build:native:mac

      - name: Verify helper architecture
        run: |
          test -x resources/native/pi-computer-use-helper
          file resources/native/pi-computer-use-helper

  macos-engines:
    # The engines users actually run on a Mac: real Claude Code and Codex CLIs, offline models.
    needs: verify
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the pinned Codex CLI
        run: echo "PI_DESKTOP_CODEX_EXECUTABLE=$(node scripts/fetch-engine.mjs codex .engines)" >> "$GITHUB_ENV"

      - name: Engine hosts against the real CLIs
        run: npx vitest run src/codex-host src/claude-host src/main/engine-binaries.test.ts

      - name: Build
        run: npm run build

      - name: Engines in the real app
        run: >-
          npx playwright test
          tests/e2e/codex-runtime.spec.ts
          tests/e2e/claude-runtime.spec.ts
          tests/e2e/engine-download.spec.ts
          tests/e2e/engine-accounts.spec.ts
          --reporter=line

      - name: Upload engine diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: macos-engines-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            artifacts/e2e/

  e2e-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fonts for Chinese UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'

      - name: Build
        run: npm run build

      - name: Install Electron test runtime
        run: node node_modules/electron/install.js

      - name: Fetch the pinned Codex CLI
        run: echo "PI_DESKTOP_CODEX_EXECUTABLE=$(node scripts/fetch-engine.mjs codex .engines)" >> "$GITHUB_ENV"

      - name: Electron architecture and UI smoke
        run: >-
          xvfb-run -a npx playwright test
          tests/e2e/engine-accounts.spec.ts
          tests/e2e/engine-download.spec.ts
          tests/e2e/codex-runtime.spec.ts
          tests/e2e/multi-session.spec.ts
          tests/e2e/claude-runtime.spec.ts
          tests/e2e/mobile-delivery.spec.ts
          tests/e2e/mobile-remote-browser.spec.ts
          tests/e2e/model-picker.spec.ts
          tests/e2e/session-task.spec.ts
          tests/e2e/desktop-settings.spec.ts
          tests/e2e/ui-experience.spec.ts
          tests/e2e/session-history.spec.ts
          tests/e2e/work-summary.spec.ts
          tests/e2e/coding-flow.spec.ts
          tests/e2e/plugin-runtime.spec.ts
          tests/e2e/git-plugin.spec.ts
          tests/e2e/bundled-host-plugins.spec.ts
          tests/e2e/plugin-agent.spec.ts
          tests/e2e/pi-compat.spec.ts
          tests/e2e/themes.spec.ts
          --reporter=line

      - name: Upload E2E diagnostics
        if: failure()
        # The account's artifact storage can fill up; that must not turn CI red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            artifacts/e2e/

      - name: Upload UI previews
        if: always()
        # The account's artifact storage can fill up; that must not turn CI red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ui-experience-previews-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/e2e/ui-experience/

  package-pr:
    needs: e2e-smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build macOS Computer Use helper
        run: npm run build:native:mac

      - name: Package macOS ARM64 preview
        env:
          # electron-builder skips all signing on pull_request events unless this is explicit.
          # This preview uses only the configured ad-hoc identity ("-"); no signing secret is exposed.
          CSC_FOR_PULL_REQUEST: "true"
        run: npx electron-builder --mac dmg zip --publish never

      - name: Verify preview code signature
        run: |
          test -x "dist/mac-arm64/Pi Desktop.app/Contents/Helpers/pi-computer-use-helper"
          codesign --verify --strict --verbose=2 "dist/mac-arm64/Pi Desktop.app/Contents/Helpers/pi-computer-use-helper"
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/Pi Desktop.app"

      - name: Add PR preview instructions
        run: |
          cat > "dist/PR-PREVIEW-README.txt" <<'EOF'
          Pi Desktop PR preview
          =====================

          This build is ARM64 and ad-hoc signed for pull-request testing.
          It is NOT Apple-notarized, so macOS Gatekeeper may still block it
          after downloading it from GitHub.

          If you trust this repository and this exact CI artifact, drag
          Pi Desktop.app to /Applications, then run:

            xattr -dr com.apple.quarantine "/Applications/Pi Desktop.app"
            open "/Applications/Pi Desktop.app"

          A normal distributable build requires a Developer ID Application
          certificate plus Apple notarization.
          EOF

      - name: Upload PR installer
        # The account's artifact storage can fill up; that must not turn CI red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-macos-arm64-pr-${{ github.event.pull_request.number }}-adhoc-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  release-prepare:
    # Every green main build becomes a nightly prerelease the app can update from. The release
    # stays a draft until all installers are attached.
    needs: [e2e-smoke, macos-engines]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nightly version
        id: version
        run: echo "version=$(node -p "require('./package.json').version.split('-')[0]")-nightly.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git log -1 --format='%B' > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --target "$GITHUB_SHA" --title "Pi Desktop $VERSION（测试版）" --notes-file notes.md

  package:
    needs: release-prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            command: npx electron-builder --mac dmg zip --publish never
          - name: macos-x64
            os: macos-15-intel
            command: npx electron-builder --mac dmg zip --publish never
          - name: windows-x64
            os: windows-2025
            command: npx electron-builder --win nsis --publish never
          - name: linux-x64
            os: ubuntu-24.04
            command: npx electron-builder --linux AppImage deb --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp the nightly version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.release-prepare.outputs.version }}"

      - name: Build
        run: npm run build

      - name: Build macOS Computer Use helper
        if: startsWith(matrix.name, 'macos-')
        run: npm run build:native:mac

      - name: Package installer
        run: ${{ matrix.command }}

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          shopt -s nullglob
          # Both Mac builds write latest-mac.yml; release-publish merges them.
          if [ -f dist/latest-mac.yml ]; then mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.name }}.yml"; fi
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Report installer size
        shell: bash
        run: |
          {
            echo "### Installer size (${{ matrix.name }})"
            echo '```'
            find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec du -h {} \;
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged Computer Use helper
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name 'Pi Desktop.app' -print -quit)"
          test -n "$app_path"
          test -x "$app_path/Contents/Helpers/pi-computer-use-helper"
          codesign --verify --strict --verbose=2 "$app_path/Contents/Helpers/pi-computer-use-helper"

      - name: Upload installer
        # The account's artifact storage can fill up; that must not turn CI red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  release-publish:
    needs: [release-prepare, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge the macOS update info and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          mkdir -p mac-info
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir mac-info --pattern 'latest-mac-*.yml'
          node scripts/merge-mac-update-info.mjs mac-info/latest-mac-*.yml > latest-mac.yml
          gh release upload "v$VERSION" latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
          for file in mac-info/latest-mac-*.yml; do
            gh release delete-asset "v$VERSION" "$(basename "$file")" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

      - name: Keep the ten newest nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          # Runs cancelled by a newer push leave drafts behind; those go, and of the published
          # nightlies the ten newest stay.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt,isDraft \
            --jq '[.[] | select(.tagName | contains("-nightly."))] | sort_by(.createdAt) | reverse
                  | ([.[] | select(.isDraft)] + ([.[] | select(.isDraft | not)] | .[10:])) | .[].tagName' |
            while read -r tag; do
              if [ "$tag" != "v$VERSION" ]; then
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              fi
            done
