name: UI integration verification
on:
  push:
    branches: [codex/ui-experience-refresh]
    paths: [.github/workflows/ui-workspace-check.yml]
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/codex/ui-experience-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and apply locally tested source patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const encoded = ['00', '01', '02'].map(p => fs.readFileSync('.ui-refresh-payload/' + p, 'utf8')).join('');
          const patch = require('node:zlib').brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const expected = 'ead55fe00d660863e30d20c9bc0282823aeda4bb6aec8f9f2983406726bba632';
          if (crypto.createHash('sha256').update(patch).digest('hex') !== expected) throw new Error('Patch checksum mismatch');
          fs.writeFileSync('/tmp/pi-ui-feature.patch', patch);
          NODE
          git apply --check /tmp/pi-ui-feature.patch
          git apply --index /tmp/pi-ui-feature.patch
          git diff --cached --check
      - name: Install dependencies and Electron runtime
        run: |
          npm ci
          node node_modules/electron/install.js
          git --version
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Real Electron architecture and interaction checks
        run: >-
          xvfb-run -a npx playwright test
          tests/e2e/multi-session.spec.ts
          tests/e2e/session-task.spec.ts
          tests/e2e/ui-experience.spec.ts
          --reporter=line
      - name: Commit verified implementation to the isolated feature branch
        run: |
          test "$(git ls-remote origin refs/heads/codex/ui-experience-refresh | cut -f1)" = "$GITHUB_SHA"
          git rm -r -- .ui-refresh-payload
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: refresh workspace UI and add reversible project and session management'
          git push origin HEAD:refs/heads/codex/ui-experience-refresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-ui-previews
          path: |
            artifacts/e2e/ui-experience/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
