name: UI workspace check
on:
  push:
    branches: [codex/ui-experience-refresh]
    paths: [.github/workflows/ui-workspace-check.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Archive Electron test runtime only
        run: tar -czf /tmp/pi-electron-runtime.tar.gz node_modules/electron/dist node_modules/electron/path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pi-electron-runtime
          path: /tmp/pi-electron-runtime.tar.gz
          retention-days: 1
