name: UI workspace check
on:
  push:
    branches: [codex/ui-experience-refresh]
    paths: [.github/workflows/ui-workspace-check.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive tracked source and test dependencies (no credentials or Git metadata)
        run: |
          git archive HEAD | gzip > /tmp/pi-ui-source.tar.gz
          tar -czf /tmp/pi-ui-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pi-ui-workspace
          path: |
            /tmp/pi-ui-source.tar.gz
            /tmp/pi-ui-dependencies.tar.gz
          retention-days: 1
